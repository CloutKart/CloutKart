<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta -->
    <title>CloutKart — Creative Production, Automated</title>
    <meta name="description" content="CloutKart automates and optimises the creative production process: brief intake, concepting, variant fan-out, QC, and export-ready delivery in a 48-hour cycle, with every run tuned by the last run’s performance." />
    <meta name="keywords" content="creative production automation, creative operations, creative ops platform, ad production pipeline, automated ad creative production, creative workflow automation, variant generation, creative QC automation, batch creative production, campaign asset delivery, creative production optimisation" />
    <meta name="author" content="CloutKart" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="theme-color" content="#080808" />
    <meta name="color-scheme" content="light dark" />

    <!-- Set theme before first paint to avoid a flash of the wrong theme -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('ck-theme');
          // Dark is home base (the drawing sheet); only an explicit stored choice overrides it.
          var theme = stored === 'light' ? 'light' : 'dark';
          document.documentElement.dataset.theme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'light' ? '#F2F2F6' : '#080808');
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>

    <!-- Canonical -->
    <link rel="canonical" href="https://clout-kart.com/" />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

            "itemOffered": {
